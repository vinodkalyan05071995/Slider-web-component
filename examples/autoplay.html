<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slider-element — Autoplay</title>
  <link rel="stylesheet" href="../slider-element.css">
  <link rel="stylesheet" href="examples.css">
  <script src="../slider-element.js" defer></script>
</head>
<body>
  <a class="back" href="index.html">← All examples</a>
  <h1>Autoplay</h1>
  <p><code>autoplay="3000"</code> sets the interval in ms. It adds a play/pause button, pauses on hover, stops when keyboard focus enters, and doesn't start for users who prefer reduced motion.</p>

  <slider-element label="Autoplay example" class="wide" loop autoplay="3000">
    <div><img src="https://picsum.photos/seed/auto1/1200/600" alt="Example photo 1"></div>
    <div><img src="https://picsum.photos/seed/auto2/1200/600" alt="Example photo 2"></div>
    <div><img src="https://picsum.photos/seed/auto3/1200/600" alt="Example photo 3"></div>
    <div><img src="https://picsum.photos/seed/auto4/1200/600" alt="Example photo 4"></div>
  </slider-element>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slider-element — JavaScript API &amp; events</title>
  <style>#log { max-height: 16rem; overflow: auto; margin: 0; padding: .75rem; background: #f6f6f6; border-radius: 8px; white-space: pre-wrap; }</style>
  <link rel="stylesheet" href="../slider-element.css">
  <link rel="stylesheet" href="examples.css">
  <script src="../slider-element.js" defer></script>
</head>
<body>
  <a class="back" href="index.html">← All examples</a>
  <h1>JavaScript API &amp; events</h1>
  <p>Drive the slider from your own controls and watch every event it fires. Try the buttons, dragging, clicking a slide, the play/pause button, and resizing the window past 768px.</p>

  <slider-element id="api-demo" label="API example" loop autoplay="5000" per-view="1" gap="16"
             breakpoints='{"768": {"perView": 2}}'>
    <div class="card" style="--bg:#0f766e"><a href="#">Slide 1</a></div>
    <div class="card" style="--bg:#7c3aed"><a href="#">Slide 2</a></div>
    <div class="card" style="--bg:#be123c"><a href="#">Slide 3</a></div>
    <div class="card" style="--bg:#b45309"><a href="#">Slide 4</a></div>
    <div class="card" style="--bg:#1d4ed8"><a href="#">Slide 5</a></div>
    <div class="card" style="--bg:#4d7c0f"><a href="#">Slide 6</a></div>
  </slider-element>

  <p>
    <button type="button" data-action="prev">prev()</button>
    <button type="button" data-action="next">next()</button>
    <button type="button" data-action="goTo">goTo(3)</button>
    <button type="button" data-action="play">play()</button>
    <button type="button" data-action="pause">pause()</button>
    <button type="button" data-action="clear">Clear log</button>
  </p>
  <pre class="log" id="log" aria-label="Event log"></pre>

  <script>
    const slider = document.getElementById('api-demo');
    const log = document.getElementById('log');

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (action === 'clear') log.textContent = '';
        else if (action === 'goTo') slider.goTo(3);
        else slider[action]();
      });
    });

    const events = ['slider-ready', 'slide-change', 'slide-moved', 'slide-click', 'slider-drag-start',
      'slider-drag-end', 'slider-autoplay', 'slider-update'];

    events.forEach(name => slider.addEventListener(name, e => {
      const { slide, originalEvent, ...detail } = e.detail; // DOM objects don't print well
      if (slide) detail.slide = slide.textContent.trim();
      log.textContent = `${name} ${JSON.stringify(detail)}\n` + log.textContent;
    }));

    // slider-ready may already have fired before this script ran.
    if (slider.ready) log.textContent = `(slider already ready: index ${slider.index})\n`;
  </script>
</body>
</html>

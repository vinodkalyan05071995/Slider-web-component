<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slider-element — Responsive (breakpoints)</title>
  <link rel="stylesheet" href="../slider-element.css">
  <link rel="stylesheet" href="examples.css">
  <script src="../slider-element.js" defer></script>
</head>
<body>
  <a class="back" href="index.html">← All examples</a>
  <h1>Responsive (breakpoints)</h1>
  <p>Mobile-first <code>min-width</code> breakpoints change <code>perView</code>, <code>perMove</code> and <code>gap</code>. A fractional per-view lets the next slide peek in. Resize the window to see it change.</p>

  <slider-element label="Responsive example" per-view="1.2" gap="12"
             breakpoints='{"640": {"perView": 2, "gap": 16}, "1024": {"perView": 4, "perMove": 2, "gap": 20}}'>
    <div class="card" style="--bg:#0f766e"><a href="#">Slide 1</a></div>
    <div class="card" style="--bg:#7c3aed"><a href="#">Slide 2</a></div>
    <div class="card" style="--bg:#be123c"><a href="#">Slide 3</a></div>
    <div class="card" style="--bg:#b45309"><a href="#">Slide 4</a></div>
    <div class="card" style="--bg:#1d4ed8"><a href="#">Slide 5</a></div>
    <div class="card" style="--bg:#4d7c0f"><a href="#">Slide 6</a></div>
    <div class="card" style="--bg:#9d174d"><a href="#">Slide 7</a></div>
    <div class="card" style="--bg:#0f766e"><a href="#">Slide 8</a></div>
  </slider-element>
</body>
</html>

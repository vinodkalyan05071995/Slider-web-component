<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slider-element — Fade transition</title>
  <link rel="stylesheet" href="../slider-element.css">
  <link rel="stylesheet" href="examples.css">
  <script src="../slider-element.js" defer></script>
</head>
<body>
  <a class="back" href="index.html">← All examples</a>
  <h1>Fade transition</h1>
  <p><code>transition="fade"</code> cross-fades slides. <code>speed</code> sets the duration in ms.</p>

  <slider-element label="Fade example" class="wide" transition="fade" speed="700" loop>
    <div><img src="https://picsum.photos/seed/fade1/1200/600" alt="Example photo 1"></div>
    <div><img src="https://picsum.photos/seed/fade2/1200/600" alt="Example photo 2"></div>
    <div><img src="https://picsum.photos/seed/fade3/1200/600" alt="Example photo 3"></div>
    <div><img src="https://picsum.photos/seed/fade4/1200/600" alt="Example photo 4"></div>
  </slider-element>
</body>
</html>
